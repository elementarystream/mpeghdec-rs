# Rust port of the Fraunhofer FDK MPEG-H Software (mpeghdec r4.0.1).
# Third-Party Modified Version of the Fraunhofer FDK MPEG-H Software.
# See LICENSE.txt for the complete license text.

# Build, lints and unit tests. The differential and end-to-end tests need the C++ reference and
# the test material in work/ (README.md, "Development") and are skipped here.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal -c rustfmt,clippy && rustup default stable
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo doc --workspace --no-deps --locked --exclude mpeghdec-cref
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        # x86-64 (AVX2 and portable code paths) and AArch64 variants
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - run: cargo test --workspace --release --locked
      - if: runner.os == 'Linux'
        run: cargo test --workspace --release --locked
        env:
          MPEGHDEC_NO_SIMD: "1"

  test-i686:
    # 32 bit x86 variant (x87 floating point)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gcc-multilib
      - run: |
          rustup toolchain install stable --profile minimal -t i686-unknown-linux-gnu
          rustup default stable
      - run: cargo test --workspace --release --locked --target i686-unknown-linux-gnu

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.85.0 --profile minimal && rustup default 1.85.0
      - run: cargo check --workspace --all-targets --locked
