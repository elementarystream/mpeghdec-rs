# Differential fuzz targets: the C++ reference (through mpeghdec-cref) against the port
# (fuzz/README.md). A workspace of its own, excluded from the main workspace; built with
# cargo-fuzz (nightly) in the container of fuzz/run.sh. The `replay` and `seedgen` binaries
# also build with the stable toolchain.
[package]
name = "mpeghdec-fuzz"
version = "0.0.0"
edition = "2021"
publish = false
license-file = "../LICENSE.txt"

[package.metadata]
cargo-fuzz = true

[lib]
name = "mpeghdec_fuzz"
path = "src/lib.rs"

[dependencies]
libfuzzer-sys = "0.4"
mpeghdec-cref = { path = "../crates/cref" }
mpeghdec-core = { path = "../crates/core" }
mpeghdec-uimanager = { path = "../crates/uimanager" }
mpeghdec-fdk = { path = "../crates/fdk" }

[features]
# The replay and seedgen binaries (plain builds, not instrumented: `cargo fuzz build` skips them).
tools = []

[build-dependencies]
cc = "1"

[workspace]
members = ["."]

[profile.release]
opt-level = 3
debug = 1

[[bin]]
name = "decode_mhas"
path = "fuzz_targets/decode_mhas.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_mha1"
path = "fuzz_targets/decode_mha1.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ui_decode"
path = "fuzz_targets/ui_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "replay"
path = "src/bin/replay.rs"
test = false
doc = false
bench = false
required-features = ["tools"]

[[bin]]
name = "seedgen"
path = "src/bin/seedgen.rs"
test = false
doc = false
bench = false
required-features = ["tools"]
